<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="VIABLE harness, the open engine behind the VIABLE Developer Platform. Your app, your AI assistant and the hosted platform all run on it: agents, the teacher's settings, reply checks, agent tests, learner measures and a catalog of open education resources, on the model endpoint you choose.">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .fg { fill: #1f2328; } .mu { fill: #59636e; } .ac { fill: #0969da; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .core { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #b6d7f5; }
    .pill { fill: #ffffff; stroke: #d1d9e0; }
    .ln { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .hd { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .fg { fill: #f0f6fc; } .mu { fill: #9198a1; } .ac { fill: #4493f8; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .core { fill: #12233d; stroke: #4493f8; }
      .chip { fill: #0d1117; stroke: #2a4a75; }
      .pill { fill: #0d1117; stroke: #3d444d; }
      .ln { stroke: #9198a1; } .hd { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1199" height="339" rx="20"/>

  <g class="t">
    <text class="ac" x="56" y="70" font-size="13" font-weight="600" letter-spacing="1.6">OPEN-SOURCE ENGINE FOR EDUCATION AI</text>
    <text class="fg" x="56" y="124" font-size="46" font-weight="700">VIABLE harness</text>
    <text class="mu" x="56" y="164" font-size="18">The engine behind the VIABLE Developer Platform,</text>
    <text class="mu" x="56" y="190" font-size="18">open for anyone: run tutoring agents where you choose,</text>
    <text class="mu" x="56" y="216" font-size="18">with the teacher’s settings and checks built in.</text>

    <rect class="pill" x="56" y="250" width="112" height="30" rx="15"/>
    <text class="fg" x="112" y="270" font-size="13" text-anchor="middle">MIT licensed</text>
    <rect class="pill" x="180" y="250" width="246" height="30" rx="15"/>
    <text class="fg" x="303" y="270" font-size="13" text-anchor="middle">Your keys or open-weight models</text>
    <rect class="pill" x="438" y="250" width="210" height="30" rx="15"/>
    <text class="fg" x="543" y="270" font-size="13" text-anchor="middle">CLI · server · MCP · Skills</text>

    <rect class="box" x="690" y="56" width="140" height="52" rx="10"/>
    <text class="fg" x="760" y="80" font-size="13" font-weight="600" text-anchor="middle">Your app</text>
    <text class="mu" x="760" y="97" font-size="11.5" text-anchor="middle">calls it as a server</text>
    <rect class="box" x="845" y="56" width="140" height="52" rx="10"/>
    <text class="fg" x="915" y="80" font-size="13" font-weight="600" text-anchor="middle">Your AI assistant</text>
    <text class="mu" x="915" y="97" font-size="11.5" text-anchor="middle">through MCP</text>
    <rect class="box" x="1000" y="56" width="148" height="52" rx="10"/>
    <text class="fg" x="1074" y="80" font-size="13" font-weight="600" text-anchor="middle">Developer Platform</text>
    <text class="mu" x="1074" y="97" font-size="11.5" text-anchor="middle">hosts it for you</text>

    <rect class="core" x="690" y="140" width="458" height="122" rx="14"/>
    <text class="fg" x="710" y="166" font-size="15" font-weight="700">VIABLE harness</text>
    <rect class="chip" x="710" y="180" width="136" height="30" rx="8"/><text class="fg" x="778" y="200" font-size="12.5" text-anchor="middle">agents</text>
    <rect class="chip" x="852" y="180" width="136" height="30" rx="8"/><text class="fg" x="920" y="200" font-size="12.5" text-anchor="middle">teacher’s settings</text>
    <rect class="chip" x="994" y="180" width="136" height="30" rx="8"/><text class="fg" x="1062" y="200" font-size="12.5" text-anchor="middle">reply checks</text>
    <rect class="chip" x="710" y="218" width="136" height="30" rx="8"/><text class="fg" x="778" y="238" font-size="12.5" text-anchor="middle">agent tests</text>
    <rect class="chip" x="852" y="218" width="136" height="30" rx="8"/><text class="fg" x="920" y="238" font-size="12.5" text-anchor="middle">learner measures</text>
    <rect class="chip" x="994" y="218" width="136" height="30" rx="8"/><text class="fg" x="1062" y="238" font-size="12.5" text-anchor="middle">open resources</text>

    <text class="mu" x="919" y="300" font-size="12.5" text-anchor="middle">on the model endpoint you choose: OpenAI, Ollama, vLLM, any OpenAI-compatible API</text>
  </g>

  <path class="ln" d="M760,108 V138" marker-end="url(#a)"/>
  <path class="ln" d="M915,108 V138" marker-end="url(#a)"/>
  <path class="ln" d="M1074,108 V138" marker-end="url(#a)"/>
  <path class="ln" d="M919,262 V284" marker-end="url(#a)"/>
</svg>
