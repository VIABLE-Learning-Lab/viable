<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="The Developer Platform is hosted and adds the workflow editor, knowledge bases, courses and class lists, consent, studies and the research export, and logs and billing. A course or agent downloaded from it as a package runs on your own server or cloud, with any OpenAI-compatible model and the same learner pages and teacher’s page. Both are one engine, the VIABLE harness, and your app sends the same request to either.">
<style>@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:200 800;src:url(data:font/woff2;base64,) format("woff2")}
:root{--mist:#e9eef5;--sage:#e7eee9;--lilac:#ecebf4;--ink:#141c28;--text:#444e5e;--muted:#54607a;--rule:#dfe3ea;--paper:#ffffff;--blue:#1f47a8;--on-blue:#ffffff;--pass:#2e6f4c;--fail:#a8423a}
@media (prefers-color-scheme:dark){:root{--mist:#131b2a;--sage:#132019;--lilac:#191a2d;--ink:#eef1f6;--text:#b8c0ce;--muted:#99a3b4;--rule:#273041;--paper:#172030;--blue:#93b2f7;--on-blue:#0b1324;--pass:#7fcba0;--fail:#ec9a90}}
text{font-family:"Atkinson Hyperlegible Next",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.ink{fill:var(--ink)}.muted{fill:var(--muted)}.pass{fill:var(--pass)}.fail{fill:var(--fail)}.rule{stroke:var(--rule);stroke-width:1}
.dot{stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:0 9;fill:none}</style>
<rect x="0" y="0" width="512" height="396" rx="22" fill="var(--lilac)"/>
<text x="32" y="44" font-size="15" font-weight="600" class="muted">Hosted</text>
<text x="32" y="92" font-size="38" font-weight="300" class="ink" letter-spacing="-1.2">VIABLE Developer</text><text x="32" y="134" font-size="38" font-weight="300" class="ink" letter-spacing="-1.2">Platform</text>
<line class="rule" x1="32" y1="170" x2="480" y2="170" style="stroke:var(--muted);stroke-opacity:.28"/><text x="32" y="197" font-size="17" font-weight="400" class="">Build agents in the workflow editor</text><line class="rule" x1="32" y1="212" x2="480" y2="212" style="stroke:var(--muted);stroke-opacity:.28"/><text x="32" y="239" font-size="17" font-weight="400" class="">Knowledge bases from files and websites</text><line class="rule" x1="32" y1="254" x2="480" y2="254" style="stroke:var(--muted);stroke-opacity:.28"/><text x="32" y="281" font-size="17" font-weight="400" class="">Courses, class lists, sections and sign-in</text><line class="rule" x1="32" y1="296" x2="480" y2="296" style="stroke:var(--muted);stroke-opacity:.28"/><text x="32" y="323" font-size="17" font-weight="400" class="">Consent, studies and the research export</text><line class="rule" x1="32" y1="338" x2="480" y2="338" style="stroke:var(--muted);stroke-opacity:.28"/><text x="32" y="365" font-size="17" font-weight="400" class="">Logs, usage and billing</text>
<rect x="688" y="0" width="512" height="396" rx="22" fill="var(--sage)"/>
<text x="720" y="44" font-size="15" font-weight="600" class="muted">Yours</text>
<text x="720" y="92" font-size="38" font-weight="300" class="ink" letter-spacing="-1.2">Your own server</text><text x="720" y="134" font-size="38" font-weight="300" class="ink" letter-spacing="-1.2">or cloud</text>
<line class="rule" x1="720" y1="170" x2="1168" y2="170" style="stroke:var(--muted);stroke-opacity:.28"/><text x="720" y="197" font-size="17" font-weight="400" class="">Cloudflare, AWS, Google Cloud, Firebase or Node</text><line class="rule" x1="720" y1="212" x2="1168" y2="212" style="stroke:var(--muted);stroke-opacity:.28"/><text x="720" y="239" font-size="17" font-weight="400" class="">Any OpenAI-compatible model, with your keys</text><line class="rule" x1="720" y1="254" x2="1168" y2="254" style="stroke:var(--muted);stroke-opacity:.28"/><text x="720" y="281" font-size="17" font-weight="400" class="">The same learner pages and teacher’s page</text><line class="rule" x1="720" y1="296" x2="1168" y2="296" style="stroke:var(--muted);stroke-opacity:.28"/><text x="720" y="323" font-size="17" font-weight="400" class="">Learners’ records stay where you keep them</text><line class="rule" x1="720" y1="338" x2="1168" y2="338" style="stroke:var(--muted);stroke-opacity:.28"/><text x="720" y="365" font-size="17" font-weight="400" class="">No editor, accounts, class lists or studies</text>
<text x="600" y="206" font-size="15" font-weight="500" class="ink" text-anchor="middle">A course or agent,</text><text x="600" y="228" font-size="15" font-weight="500" class="ink" text-anchor="middle">downloaded as a</text><text x="600" y="250" font-size="15" font-weight="500" class="ink" text-anchor="middle">package</text>
<path class="dot" d="M526 176H668"/><path d="M664 170l8 6-8 6" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="0" y="412" width="1200" height="56" rx="28" fill="var(--blue)"/>
<text x="600" y="447" font-size="19" font-weight="500" style="fill:var(--on-blue)" text-anchor="middle">One engine, the VIABLE harness. An agent behaves the same in both.</text>
<text x="600" y="492" font-size="15" class="muted" text-anchor="middle">Your app sends the same request to either.</text>
</svg>
