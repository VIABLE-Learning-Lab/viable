AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: {{title_yaml}} on the VIABLE harness.

Parameters:
  OpenAiBaseUrl:
    Type: String
    Default: "{{endpoint}}"
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ''
  HarnessToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: What callers send as Authorization Bearer. Make one with openssl rand -hex 32.
  EngineSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Encrypts the provider keys saved at /console. Without it, none can be saved.
{{#store}}  KeepDays:
    Type: Number
    Default: 180
    Description: Days to keep what learners wrote, conversations and runs before they are deleted.
{{/store}}
Resources:
  Server:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          OPENAI_BASE_URL: !Ref OpenAiBaseUrl
          OPENAI_API_KEY: !Ref OpenAiApiKey
          VIABLE_ENGINE_TOKEN: !Ref HarnessToken
          VIABLE_ENGINE_SECRET: !Ref EngineSecret
          # Under the function's Timeout, so a run past it gets an answer instead of being cut off.
          VIABLE_ENGINE_TIMEOUT: '280'
{{#store}}          VIABLE_ENGINE_KEEP_DAYS: !Ref KeepDays
          VIABLE_STORE_BUCKET: !Ref Store
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref Store
{{/store}}      FunctionUrlConfig:
        # The harness checks the token itself, so the address is open and each call is checked.
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
{{#store}}
  # S3's lifecycle rules count from a fixed prefix, which a course's turns and drafts don't have, so this deletes them.
  Sweeper:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.sweep
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          OPENAI_BASE_URL: !Ref OpenAiBaseUrl
          VIABLE_ENGINE_TOKEN: !Ref HarnessToken
          VIABLE_ENGINE_KEEP_DAYS: !Ref KeepDays
          VIABLE_STORE_BUCKET: !Ref Store
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref Store
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  Store:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-conversations
            Status: Enabled
            Prefix: conversations/
            ExpirationInDays: !Ref KeepDays
          - Id: delete-old-runs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: !Ref KeepDays
{{/store}}
Outputs:
  Url:
    Description: The server's address.
    Value: !GetAtt ServerUrl.FunctionUrl
