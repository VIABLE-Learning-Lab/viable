# {{title}}: docker compose up -d --build. Its settings come from your shell or a .env file beside this one.
services:
  {{name}}:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VIABLE_ENGINE_TOKEN: ${VIABLE_ENGINE_TOKEN:?set it, to the output of openssl rand -hex 32}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-{{endpoint}}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VIABLE_ENGINE_SECRET: ${VIABLE_ENGINE_SECRET:-}
      VIABLE_ENGINE_CORS: ${VIABLE_ENGINE_CORS:-}
      VIABLE_ENGINE_ALLOW_COMPONENTS: ${VIABLE_ENGINE_ALLOW_COMPONENTS:-}
{{#store}}      VIABLE_ENGINE_KEEP_DAYS: ${VIABLE_ENGINE_KEEP_DAYS:-180}
    volumes:
      - data:/data
volumes:
  data:
{{/store}}