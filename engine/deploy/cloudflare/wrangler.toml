name = "{{name}}"
main = "index.js"
compatibility_date = "2026-09-01"
# So that a run stops, and stops spending model calls, when the caller leaves.
compatibility_flags = ["global_fetch_strictly_public", "enable_request_signal"]

# The package: not served to anyone, read only by index.js through this binding.
[assets]
directory = "./package"
binding = "PACKAGE"
run_worker_first = true
# The diagram frame's .html file keeps its name.
html_handling = "none"

[vars]
OPENAI_BASE_URL = "{{endpoint}}"
{{#store}}VIABLE_ENGINE_KEEP_DAYS = "180"

# Conversations, runs and memory. Create it with: npx wrangler d1 create {{name}}
[[d1_databases]]
binding = "DB"
database_name = "{{name}}"
database_id = "00000000-0000-0000-0000-000000000000"

# Once a day, delete what VIABLE_ENGINE_KEEP_DAYS has passed.
[triggers]
crons = ["17 3 * * *"]
{{/store}}
